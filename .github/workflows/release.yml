name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Test before release
        run: ./scripts/test.sh
      - name: Configure Developer ID signing and notarization
        env:
          CERTIFICATE_P12: ${{ secrets.MOREMENU_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MOREMENU_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MOREMENU_CODE_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.MOREMENU_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MOREMENU_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_P12:?Configure MOREMENU_CERTIFICATE_P12 before publishing}"
          : "${CERTIFICATE_PASSWORD:?Configure MOREMENU_CERTIFICATE_PASSWORD}"
          : "${SIGNING_IDENTITY:?Configure MOREMENU_CODE_SIGN_IDENTITY}"
          : "${NOTARY_APPLE_ID:?Configure MOREMENU_NOTARY_APPLE_ID}"
          : "${NOTARY_PASSWORD:?Configure MOREMENU_NOTARY_PASSWORD}"
          SIGNING_KEYCHAIN="$RUNNER_TEMP/moremenu-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/moremenu.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/moremenu.p12" -k "$SIGNING_KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN"
          xcrun notarytool store-credentials moremenu-release --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id QN24ZH7M6W --keychain "$SIGNING_KEYCHAIN"
      - name: Build signed and notarized DMG
        env:
          MOREMENU_CODE_SIGN_IDENTITY: ${{ secrets.MOREMENU_CODE_SIGN_IDENTITY }}
          MOREMENU_DISTRIBUTION: '1'
          MOREMENU_NOTARY_PROFILE: moremenu-release
          MOREMENU_NOTARY_KEYCHAIN: ${{ runner.temp }}/moremenu-signing.keychain-db
        run: ./scripts/build-release-dmg.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG_PATH="dist/MoreMenu-${GITHUB_REF_NAME}.dmg"
          test -f "$DMG_PATH"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$DMG_PATH" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/moremenu-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/moremenu.p12"
